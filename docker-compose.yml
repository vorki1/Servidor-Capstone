services:
  postgres-capstone:
    image: postgres:16
    container_name: postgres-capstone
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: capstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_capstone_data:/var/lib/postgresql/data

volumes:
  postgres_capstone_data: