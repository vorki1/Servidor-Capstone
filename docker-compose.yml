services:
  fastapi-capstone:
    build: .
    container_name: fastapi-capstone
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/servidor-capstone/app
      - ./logs:/servidor-capstone/logs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - postgres-capstone

  postgres-capstone:
    image: postgres:16
    container_name: postgres-capstone
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: capstone
    ports:
      - "5432:5432"
    volumes:
      - postgres_capstone_data:/var/lib/postgresql/data

volumes:
  postgres_capstone_data: